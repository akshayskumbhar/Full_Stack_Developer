<!DOCTYPE html>
<html>
<head>
  <title>jQuery Basics</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<h1>jQuery Basics</h1>

<h2>Selectors</h2>
<p>Selectors are used to select HTML elements.</p>

<code>
$("#id")
$(".class")
$("tag")
</code>

<h2>Example</h2>
<div class="example">
<button id="btn">Click Me</button>
<p id="text">Hello jQuery</p>

<script>
$(document).ready(function(){
  $("#btn").click(function(){
    $("#text").hide();
  });
});
</script>
</div>

<h2>Events</h2>
<p>Events respond to user actions.</p>

<code>
click(), dblclick(), mouseenter(), keypress()
</code>
